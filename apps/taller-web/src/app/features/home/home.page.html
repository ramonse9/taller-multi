<main class="home-page">
  <header>
    <p>INICIO</p>
    <h1>Hola, {{ auth.user()?.fullName }}</h1>
    <span>Selecciona una sección para continuar.</span>
  </header>

  <section aria-labelledby="available-modules-title">
    <h2 id="available-modules-title">Accesos disponibles</h2>
    <div class="module-list">
      @for (item of modules(); track item.link) {
      <a [routerLink]="item.link">
        <strong>{{ item.label }}</strong>
        <span>{{ item.description }}</span>
      </a>
      }
    </div>
  </section>
</main>
