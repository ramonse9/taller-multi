<div class="w-full max-w-sm p-4 bg-gray-100 border border-gray-200 rounded-lg shadow-sm sm:p-6 md:p-8 dark:bg-gray-800 dark:border-gray-700">
  <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div>
          <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
          <input type="email" name="email" id="email" autocomplete="off" formControlName="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" placeholder="nombre@empresa.com"/>
      </div>
      <div>
          <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password</label>
          <input type="password" name="password" id="password" autocomplete="off" formControlName="password" placeholder="Contraseña" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white"/>
      </div>
        <button type="submit" class="w-full text-white bg-lightblue-600 hover:bg-lightblue-500 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-darkblue-600 dark:hover:bg-darkblue-500 dark:focus:ring-blue-800 disabled:opacity-50"
              [disabled]="isLoading | async">
            {{ (isLoading | async) ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>
  </form>
</div>

@if( hasError() ){
  <div class="fixed top-10 right-10" [@fadeAnimation]>
    <app-badge-message [message]="authService.hasErrorMessage()!" [estatus]="EnumEstatusToast.DANGER" ></app-badge-message>
  </div>
}
