<div>



    <div class="grid grid-cols-1 md:grid-cols-2 xxl:grid-cols-3 gap-4 py-4">
      @for (cotizacion of cotizacionesListado(); track cotizacion.id) {
        <app-card-cotizacion [cotizacion]="cotizacion"></app-card-cotizacion>
      }
    </div>
    @if( cotizacionesListado().length === 0){
      <app-badge-message [message]="EnumCeroRegistros.COTIZACIONES"  ></app-badge-message>
    }


</div>
