    <div class="p-4 bg-gray-50/50 dark:bg-gray-800/50 border-b border-gray-100 dark:border-gray-700">

        <span class="p-2 bg-blue-600 rounded-lg">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </span>
        <div>
          <p class="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase leading-none">Folio Gasto</p>
          <a [routerLink]="['/pagos/gastos', gasto().id]" class="text-lg font-black text-gray-900 dark:text-white hover:text-blue-600 transition-colors">
            {{ gasto().id | uppercase }}
          </a>
          <div class="text-[10px] text-gray-400 dark:text-gray-500 font-medium">
            Creada: {{ gasto().createdAt | date: 'dd/MM/yyyy' }}
          </div>
        </div>
      </div>
    </div>

    <div class="p-4 space-y-4 flex-grow">

      <div class="space-y-2">
        <p class="text-[10px] font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest">Solicitante</p>
      </div>

        <div class="space-y-2">
        <p class="text-[10px] font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest">Unidad a Cotizar</p>

      </div>

        <div class="text-xs text-gray-700 dark:text-gray-300 italic leading-relaxed">
          <!--<app-text-preview [limit]="80" [text]="gasto().gastoConcepto.nombre!"></app-text-preview>-->
        </div>
      </div>

      <div class="p-3 bg-amber-50/30 dark:bg-amber-900/10 rounded-lg border-l-4 border-amber-400">
        <p class="text-[10px] font-black text-amber-600 dark:text-amber-500 uppercase mb-1">Categoría del Gasto</p>
        <div class="text-xs text-gray-700 dark:text-gray-300 italic leading-relaxed">

    <div class="mt-auto p-4 bg-gray-50 dark:bg-gray-800/50 border-t border-gray-100 dark:border-gray-700 flex justify-between items-center">

      <!--
      <div class="text-[10px] text-gray-400 dark:text-gray-500 font-medium">

          <span class="text-[9px] uppercase font-bold text-slate-500">
            Subtotal
          </span>
          <span class="text-lg font-black text-slate-700 dark:text-white tracking-tight">
            {{ gasto().monto | currency:'$ ' }}
          </span>
        </div>
      </div>

      <div class="flex gap-3">
        <a [routerLink]="['/pagos/gastos', gasto().id, 'informacion']" title="Ver detalles"
           class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-lg">
          <ng-icon name="tablerEye" size="1.2rem"></ng-icon>
        </a>
