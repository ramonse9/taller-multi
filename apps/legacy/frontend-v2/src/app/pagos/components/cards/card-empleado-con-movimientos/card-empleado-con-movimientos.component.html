<div class="relative bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 flex flex-col overflow-hidden">

    <div class="p-4 bg-gray-50/50 dark:bg-gray-800/50 border-b border-gray-100 dark:border-gray-700 flex justify-between">

      <div class="flex items-center gap-2">

        <span class="p-1 bg-blue-600 rounded-lg flex items-center text-white dark:text-white">
          <ng-icon name="tablerReportMoney" size="1.2rem"></ng-icon>
        </span>

      </div>
      <div class="text-2xl text-gray-700 dark:text-gray-300 leading-relaxed">
        <!--{{ gastoConMovimientos().totalGastado | currency:'$ ':'symbol':'1.2-2':'en' }}-->
        {{ empleadoConMovimiento().movimiento?.totalNeto | currency:'$ ':'symbol':'1.2-2':'en' }}
      </div>

    </div>

    <div class="p-4 space-y-1 flex-grow">

      <div class="text-[10px] font-bold text-green-500 dark:text-green-500 uppercase text-end tracking-widest pb-0">Movimiento en el mes de <span class="underline">{{mesNombre()}}/{{anioSeleccionado()}}</span></div>

    </div>

    <div class="p-4 border-t border-gray-100 dark:border-gray-700">
        <button
            (click)="toggleFormulario()"
            class="w-full flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 dark:text-blue-400 dark:bg-blue-900/20 dark:hover:bg-blue-900/30 rounded-lg transition-colors duration-200"
        >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
            </svg>
            <span>{{ mostrarFormulario ? 'Cancelar' : 'Agregar nuevo movimiento' }}</span>
        </button>
