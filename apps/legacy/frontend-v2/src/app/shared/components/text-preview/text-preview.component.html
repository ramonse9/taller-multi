<p 
  (click)="toggleText()" 
  class="inline break-words" 
  [class.cursor-pointer]="isLongText()"
>
  {{ displayText() }}
  
  @if (showEllipsis()) {
    <span class="text-blue-600 hover:underline"> ...</span>
  }
</p>
