<div class="relative w-full">
  @if( !plusButton() ){
    <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{label()}}</label>
    <button type="button" (click)="showDropdown()" class=" gap-1 cursor-pointer text-white  font-medium rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center"
      [ngClass]="{
        'bg-lightblue-600 hover:bg-lightblue-500 dark:bg-darkblue-600 dark:hover:bg-darkblue-500': optionSelectedValue(),
        'bg-yellow-600 hover:bg-yellow-500 dark:bg-yellow-600 dark:hover:bg-yellow-500': !optionSelectedValue(),
      }">
      {{ (optionSelectedValue() | uppercase) || optionPlaceholder()}}
      <ng-icon name="tablerSearch" size="1.2rem"></ng-icon>

    </button>
  } @else {
    @if( plusButtonMostrar() ){
      <button type="button" (click)="showDropdown()" class="cursor-pointer text-white bg-lightblue-600 hover:bg-lightblue-500 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm p-2 text-center inline-flex items-center me-2 dark:bg-darkblue-600 dark:hover:bg-darkblue-500 dark:focus:ring-blue-800">
        <svg class="w-4 h-4" aria-hidden="true" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
      </button>
    }
  }

  <div class="relative w-full">
    @if( isDropdownVisible() ){
      <div class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm hidden md:block" (click)="hideDropdown()"></div>

      <div class="fixed inset-0 z-[70] flex items-center justify-center md:p-6">

        <div class="bg-white dark:bg-gray-800 w-full h-full md:h-auto md:max-h-[90vh] md:max-w-5xl md:rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">

          <div class="relative p-4 border-b dark:border-gray-600 bg-white dark:bg-gray-800
                    after:absolute after:bottom-0 after:left-0 after:right-0 after:h-8
                    after:bg-gradient-to-b after:from-black/30 dark:after:from-black/60 after:to-transparent
                    after:pointer-events-none after:translate-y-[100%]">
            <div class="flex items-center gap-3">
              <div class="relative flex-1">
                <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                  <svg class="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 20 20">
                    <path stroke="currentColor" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                  </svg>
                </div>
                <input #inputSearch (input)="onInput(inputSearch)" type="text" placeholder="Buscar..." autocomplete="off"
                      class="block w-full p-2.5 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-blue-500">
              </div>
              <button type="button" (click)="refresh(inputSearch)" class="p-2 text-blue-600 hover:bg-blue-50 dark:hover:bg-gray-700 rounded-lg flex items-center">
                <ng-icon name="tablerTrash" size="1.2rem"></ng-icon>
              </button>

              <button type="button" (click)="hideDropdown()" class="hidden md:block text-gray-400 hover:text-gray-600 dark:hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
          </div>

          <div class="flex-1 overflow-y-auto overflow-x-auto p-4">
            <div class="min-w-full inline-block align-middle">
              <ng-content></ng-content>
            </div>
          </div>

          <div class="relative p-4 border-t dark:border-gray-600 bg-gray-50 dark:bg-gray-800/50 flex justify-end
                    before:absolute before:top-0 before:left-0 before:right-0 before:h-8
                    before:bg-gradient-to-t before:from-black/30 dark:before:from-black/60 before:to-transparent
                    before:pointer-events-none before:translate-y-[-100%]">
            <button type="button" (click)="hideDropdown()" class="w-full md:w-auto px-6 py-2.5 bg-red-600 md:bg-gray-200 text-white md:text-gray-800 dark:bg-gray-700 dark:text-white rounded-lg font-bold text-sm uppercase">
              Cerrar
            </button>
          </div>

        </div>
      </div>
    }
  </div>

</div>
