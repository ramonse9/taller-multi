<div class="relative z-50" [class.pointer-events-none]="!isOpen()">

  <div
    class="fixed inset-0 bg-black/50 transition-opacity duration-300 ease-in-out"
    [class.opacity-100]="isOpen()"
    [class.opacity-0]="!isOpen()"
    (click)="onClose()">
  </div>

  <div
    class="fixed inset-y-0 right-0 w-full md:max-w-md bg-white dark:bg-gray-800 shadow-2xl flex flex-col transform transition-transform duration-300 ease-in-out border-l border-gray-200 dark:border-gray-700"
    [class.translate-x-0]="isOpen()"
    [class.translate-x-full]="!isOpen()">

    <div class="p-4 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between">
      <h2 class="text-lg font-bold text-gray-900 dark:text-white">
        {{ title() }}
      </h2>
      <button
        (click)="onClose()"
        class="p-3 rounded-lg text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 transition-colors">
        <ng-icon name="tablerX" size="1.25rem"></ng-icon>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-6">
      <ng-content></ng-content>
    </div>

    <div class="p-4 border-t border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-850 flex justify-end gap-3">
      <ng-content select="[drawer-footer]">
        <button
          (click)="onClose()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 dark:bg-gray-700 dark:text-white dark:border-gray-600 dark:hover:bg-gray-600">
          Cerrar
        </button>
      </ng-content>
    </div>

  </div>
</div>
