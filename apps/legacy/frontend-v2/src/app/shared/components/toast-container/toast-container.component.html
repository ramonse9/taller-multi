<div class="fixed z-50 bottom-4 left-1/2 transform -translate-x-1/2 space-y-3 w-full max-w-sm px-2">
  @for(toast of toasts(); track toast.message ){

    <div
       [@toastAnimationO]="toast.state"
       class="flex items-center text-sm text-white rounded-md shadow-lg px-4 py-2"
       [ngClass]="{
        'bg-green-600': EnumEstatusToast.SUCCESS === toast.estatus,
        'bg-yellow-600': EnumEstatusToast.WARNING === toast.estatus,
        'bg-red-600': EnumEstatusToast.DANGER === toast.estatus
       }"
       role="alert">

      <div class="flex-shrink-0 w-6 h-6 mr-2 text-white">
        @if( EnumEstatusToast.SUCCESS === toast.estatus){
          <ng-icon name="tablerCircleCheck" size="1.5rem"></ng-icon>
        }
        @if( EnumEstatusToast.WARNING === toast.estatus){
          <ng-icon name="tablerAlertCircle" size="1.5rem"></ng-icon>
        }
        @if( EnumEstatusToast.DANGER === toast.estatus){
          <ng-icon name="tablerXboxX" size="1.5rem"></ng-icon>
        }
      </div>

      <div class="flex-1">
        {{ toast.message }}
      </div>

      <button type="button"
        (click)="closeToast(toast.message)"
        class="ml-2 text-gray-300 hover:text-white rounded-lg focus:ring-2 p-1 inline-flex items-center justify-center h-6 w-6"
        aria-label="Close">
        <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
        </svg>
      </button>

    </div>
  }
</div>
