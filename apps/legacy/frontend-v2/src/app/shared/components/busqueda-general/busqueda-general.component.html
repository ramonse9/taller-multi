<div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-4">

  <div class="flex flex-1 items-center w-full md:w-auto divide-x-0 md:divide-x divide-gray-100 dark:divide-gray-700">

    <div class="relative w-full lg:w-64 xl:w-96">
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
        <ng-icon class="text-gray-400" name="tablerSearch"></ng-icon>
      </div>
      <input
        type="text"
        [(ngModel)]="textoBusqueda"
        (keyup.enter)="buscar()"
        class="block w-full p-2.5 pl-10 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
        [placeholder]="placeholder()">

      @if (textoBusqueda !== '') {
        <button
          (click)="buscarLimpiar()"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-red-500">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
        </button>
      }
    </div>

    @if( opcionCards() ){
      <div class="items-center gap-2 ml-1 md:ml-4 pl-0 md:pl-4 mt-0 hidden md:flex">
        <button
          (click)="mostrar(true)"
          [class.bg-gray-200]="mostrarCards()"
          [class.dark:bg-gray-800]="mostrarCards()"
          class="p-2 rounded-full text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors flex items-center cursor-pointer">
          <ng-icon name="tablerLayoutGrid" size="1.2rem"></ng-icon>
        </button>
        <button
          (click)="mostrar(false)"
          [class.bg-gray-200]="!mostrarCards()"
          [class.dark:bg-gray-800]="!mostrarCards()"
          class="p-2 rounded-full text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors flex items-center cursor-pointer">
          <ng-icon name="tablerTable" size="1.2rem"></ng-icon>
        </button>
      </div>
    }
  </div>

  @if(opcionNuevaEntidad()){
    <div class="w-full md:w-auto flex justify-end">
      <span
        (click)="idNuevo()"
        class="inline-flex items-center justify-center w-full md:w-auto px-5 py-2.5 text-sm font-medium text-white bg-lightblue-600 dark:bg-darkblue-600 rounded-lg hover:bg-lightblue-700 dark:hover:bg-darkblue-700 shadow-md transition-all gap-2 cursor-pointer ">
        <ng-icon name="tablerPlus" ></ng-icon>
        {{ nuevaEntidad() }}
      </span>
    </div>
  }

</div>
