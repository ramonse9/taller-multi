<!-- Previsualización de imágenes
 [ngClass]="imagesFiles().length > 2 ? 'h-64' : 'h-36' "
 -->
<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 max-w-[350px] transition-all duration-500 ease-in-out">

@for(imageFile of imagesFiles(); track imageFile.url){

  <div
    class="relative cursor-zoom-in group transition-transform duration-600 ease-out hover:scale-[1.5] hover:z-40"
  >
    <img [src]="imageFile.url" alt="Imagen temporal" class="w-full object-cover rounded" />
    <a (click)="eliminar(imageFile.url)"
      class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-50 cursor-pointer">
      <svg class="w-1 h-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <path
          fill-rule="evenodd"
          d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
          clip-rule="evenodd"
        ></path>
      </svg>
    </a>
  </div>
}
</div>
