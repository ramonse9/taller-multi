
    <div
        [routerLink]="accesoRapido().path"
        class="bg-gray-50 dark:bg-gray-800 p-6 rounded-3xl shadow-ambient shadow-md hover:shadow-xl transition-all duration-300 flex flex-col items-center justify-center text-center group cursor-pointer border border-transparent hover:border-blue-200">
        <div
            class="w-14 h-14 rounded-3xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"
            [ngClass]="classColor(accesoRapido().color)"
            >
            <ng-icon [name]="accesoRapido().icon" size="2rem"></ng-icon>
        </div>
        <span class="font-headline font-bold text-on-surface dark:text-surface-bright text-slate-700 dark:text-white">
            {{accesoRapido().label}}
        </span>
    </div>
