
<div class="inline-block align-middle">
  <table class="min-w-full divide-y table-auto divide-gray-200 dark:divide-gray-600">
      <thead class="bg-gray-100 dark:bg-gray-700">
          <tr>
              <th scope="col" class="min-w-40 p-4 text-xs font-medium text-left text-gray-500 uppercase dark:text-gray-400">
                Acciones
              </th>
              <th scope="col" class="min-w-40 p-4 text-xs font-medium text-left text-gray-500 uppercase dark:text-gray-400">
                Total
              </th>
              <th scope="col" class="min-w-40 p-4 text-xs font-medium text-left text-gray-500 uppercase dark:text-gray-400">
                ID
              </th>
          </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
          @for( factura of facturas(); track factura.id ){
            <tr class="hover:bg-gray-100 dark:hover:bg-gray-700">

              <td class="pl-6 py-4">

                <label class="inline-flex items-center cursor-pointer">
                  <input type="checkbox" (change)="onToggleLiquidar($event, factura.id)" class="sr-only peer">
                  <div class="relative w-9 h-5
                            bg-yellow-500
                            bg-neutral-quaternary
                            peer-focus:outline-none
                            rounded-full
                            peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full
                            peer-checked:after:border-buffer
                            after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all
                            peer-checked:bg-green-500
                            "></div>
                  <span class="select-none ms-3 text-sm font-medium text-heading dark:text-white">Liquidar</span>
                </label>

              </td>
              <td class="p-4 text-base font-medium text-gray-900 whitespace-nowrap dark:text-white">{{ factura.total | currency:'$ ':'symbol':'1.2-2':'en' }}</td>

              <td class="p-4 text-base font-medium text-gray-900 whitespace-nowrap dark:text-white">
                <div class="flex flex-col">
                  <span>
                    {{factura.id.toUpperCase() }}
                  </span>
                  <span class="font-bold">
                    {{factura.uuid | uppercase}}
                  </span>
                  <span>
                    {{ factura.orden.id | uppercase }}
                  </span>
                </div>
              </td>
          </tr>
          }
          @empty{
            <tr>
              <td colspan="20" class="p-4 text-base font-medium text-gray-900 whitespace-nowrap dark:text-white">
                No hay facturas registradas
              </td>
            </tr>
          }
      </tbody>
  </table>
</div>
