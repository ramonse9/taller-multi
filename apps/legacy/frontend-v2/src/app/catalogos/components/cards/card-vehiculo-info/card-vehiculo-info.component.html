<div class="min-w-[350px] p-6 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700" 
    [ngClass]="{'transition-transform duration-300 ease-out hover:scale-[1.3]': escalar()}">
  <div class="flex items-center gap-2">
    <p class="text-sm text-gray-500 dark:text-gray-400">
      VEHICULO:
    </p>
    <p class="text-sm font-medium text-gray-900 dark:text-white">
      {{ vehiculo().id | uppercase }}
    </p>
  </div>
  <hr class="h-px my-2 bg-gray-200 border-0 dark:bg-gray-700">
  <div class="flex items-center gap-2">

    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6 text-gray-800 dark:text-white">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 13v-2.5a1.5 1.5 0 011.5-1.5h2a1 1 0 00.9-.6l.6-1.3A1.5 1.5 0 019.9 6h4.2a1.5 1.5 0 011.3.8l.7 1.3a1 1 0 00.9.6h2A1.5 1.5 0 0121 10.5V13m-18 0v2a1 1 0 001 1h1a2 2 0 104 0h6a2 2 0 104 0h1a1 1 0 001-1v-2" />
    </svg>

    <p class="text-sm font-medium text-gray-900 truncate dark:text-white">
      {{ vehiculo().anio }} {{ vehiculo().modelo.marca.nombre | uppercase }} {{ vehiculo().modelo.nombre | uppercase}}
    </p>
  </div>
  <div class="flex items-center justify-between gap-2">
    <p class="text-sm text-gray-500 truncate dark:text-gray-400">
      {{ vehiculo().color | titlecase}}
    </p>
    <p class="text-sm text-gray-500 truncate dark:text-gray-400">
      {{ vehiculo().placa | uppercase}}
    </p>
  </div>
  <div class="flex items-center flex-row-reverse">
    <p class="text-sm text-gray-500 truncate dark:text-gray-400">
    Número de Serie {{ vehiculo().numeroSerie }}
    </p>
  </div>
  <div class="flex items-center">
    <p class="text-sm text-gray-500 dark:text-gray-400">
      <app-text-preview [limit]=20 [text]="vehiculo().descripcion!"></app-text-preview>
    </p>
  </div>
</div>
