<div class="min-w-[350px] p-6 bg-white border border-gray-200 rounded-lg text-gray-800 dark:text-white-3 shadow-sm dark:bg-gray-800 dark:border-gray-700"
      [ngClass]="{'transition-transform duration-300 ease-out hover:scale-[1.3]': escalar()}">
  <div class="flex items-center gap-2">
    <p class="text-sm text-gray-500 truncate dark:text-gray-400">
      CLIENTE:
    </p>
    <p class="text-sm font-medium text-gray-900 dark:text-white">
      {{ cliente().id | uppercase }}
    </p>
  </div>
  <hr class="h-px my-2 bg-gray-200 border-0 dark:bg-gray-700">
  <div class="flex items-center gap-2">
    <ng-icon name="tablerUser" size="1.5rem"></ng-icon>
    <p class="text-sm font-medium text-gray-900 truncate dark:text-white">
      {{ cliente().nombre | titlecase }}
    </p>
  </div>
  <div class="flex items-center gap-2">
    <ng-icon name="tablerMail" size="1.5rem"></ng-icon>
    <p class="text-sm text-gray-500 truncate dark:text-gray-400">
      {{ cliente().email }}
    </p>
  </div>
  <div class="flex items-center gap-2">
    <ng-icon name="tablerPhone" size="1.5rem"></ng-icon>
    <p class="text-sm text-gray-500 truncate dark:text-gray-400">
      {{ cliente().telefono }}
    </p>
  </div>
  <div class="flex items-center gap-2">
    <span class="text-sm text-white">
      RFC
    </span>
    <p class="text-sm text-gray-500 truncate dark:text-gray-400">
      {{ cliente().rfc | uppercase}}
    </p>
  </div>
</div>
