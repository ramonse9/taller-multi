<div
    class="bg-gray-50 dark:bg-gray-800 relative border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300
    flex flex-col lg:flex-row overflow-hidden"
      [ngClass]="{
        'border-blue-500': seleccionado(),
        'border-gray-200 dark:border-gray-700': !seleccionado()
      }"
    >

  <div class="flex justify-between p-4 border-b border-gray-100 dark:border-gray-700 flex-2">

    <app-card-component-id [entidad]="vehiculoLinked()" [label]="EnumEntidad.VEHICULO" ></app-card-component-id>

    <div class="flex flex-col">
      <h4 class="text-md font-medium text-gray-700 dark:text-gray-300">
        {{ vehiculoLinked().modelo.marca.nombre | uppercase }}
      </h4>
      <h3 class="text-lg font-extrabold text-gray-900 dark:text-white leading-tight">
        {{ vehiculoLinked().modelo.nombre | uppercase }}
      </h3>
    </div>

  </div>

  <div class="flex justify-between p-4 border-b border-gray-100 dark:border-gray-700 flex-1">

    <div class="flex flex-col">
      <span class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase leading-none mb-1">Color</span>
      <span class="font-black text-lg sm:text-lg text-slate-600 dark:text-slate-100">
        {{ vehiculoLinked().color | uppercase }}
      </span>
    </div>

    <div class=" flex items-center justify-center  text-sm font-bold bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded text-gray-600 dark:text-gray-300">
      {{ vehiculoLinked().anio }}
    </div>

  </div>

  <div class="flex flex-col justify-between p-4 border-b border-gray-100 dark:border-gray-700 flex-1">

    <div class="flex items-center justify-center bg-white border-2 border-gray-800 rounded-md p-1 mb-4 shadow-sm">
      <span class="text-xs font-bold text-gray-400 mr-2 border-r pr-2 uppercase">Número de Serie</span>
      <span class="text-xl font-mono font-black tracking-widest text-gray-900">
        {{ vehiculoLinked().numeroSerie | uppercase }}
      </span>
    </div>

    <div class=" flex items-center justify-center  text-sm font-bold bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded text-gray-600 dark:text-gray-300">
      <span class="text-xs font-bold text-gray-400 mr-2 uppercase tracking-tighter">PLACA:</span>
      <span class="text-gray-900 dark:text-gray-100 font-bold text-xs truncate">
        {{ vehiculoLinked().placa | uppercase }}
      </span>
    </div>

  </div>

</div>
