<div class="min-w-[350px] p-6 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700" 
[ngClass]="{'transition-transform duration-300 ease-out hover:scale-[1.3]': escalar()}">
  <div class="flex items-center gap-2">
    <p class="text-sm text-gray-500 truncate dark:text-gray-400">
      EMPRESA:
    </p>
    <p class="text-sm font-medium text-gray-900 dark:text-white">
      {{ empresa().id | uppercase }}
    </p>
  </div>
  <hr class="h-px my-2 bg-gray-200 border-0 dark:bg-gray-700">
  <div class="flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6 text-gray-800 dark:text-white">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M9 8h6M9 12h6M9 16h6M4 21V5a1 1 0 011-1h3a1 1 0 011 1v16M15 21V3a1 1 0 011-1h3a1 1 0 011 1v18"/>
    </svg>
    <p class="text-sm font-medium text-gray-900 truncate dark:text-white">
      {{ empresa().nombre | titlecase }}
    </p>
  </div>
  <div class="flex items-center gap-2">
    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-width="1" d="m3.5 5.5 7.893 6.036a1 1 0 0 0 1.214 0L20.5 5.5M4 19h16a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z"/>
    </svg>
    <p class="text-sm text-gray-500 truncate dark:text-gray-400">
      {{ empresa().email }}
    </p>
  </div>
  <div class="flex items-center gap-2">
    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M18.427 14.768 17.2 13.542a1.733 1.733 0 0 0-2.45 0l-.613.613a1.732 1.732 0 0 1-2.45 0l-1.838-1.84a1.735 1.735 0 0 1 0-2.452l.612-.613a1.735 1.735 0 0 0 0-2.452L9.237 5.572a1.6 1.6 0 0 0-2.45 0c-3.223 3.2-1.702 6.896 1.519 10.117 3.22 3.221 6.914 4.745 10.12 1.535a1.601 1.601 0 0 0 0-2.456Z"/>
    </svg>
    <p class="text-sm text-gray-500 truncate dark:text-gray-400">
      {{ empresa().telefono }}
    </p>
  </div>
</div>
