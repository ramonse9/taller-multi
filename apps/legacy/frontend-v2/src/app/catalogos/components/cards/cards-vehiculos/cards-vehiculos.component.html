<div class="grid grid-cols-1 sm:grid-cols-2 xxl:grid-cols-3 gap-4 p-4">
  @for (vehiculo of vehiculosListado(); track vehiculo.id) {
    <app-card-vehiculo
      class="h-full"
      [vehiculo]="vehiculo"
      >
    </app-card-vehiculo>
  }@empty{
    <div class="col-span-full">
      <app-badge-message [message]="EnumCeroRegistros.VEHICULOS"></app-badge-message>
    </div>
  }
</div>
