<div
    class="bg-gray-50 dark:bg-gray-800 relative border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300
    flex flex-col lg:flex-row overflow-hidden"
      [ngClass]="{
        'border-blue-500': seleccionado(),
        'border-gray-200 dark:border-gray-700': !seleccionado()
      }"
    >

    <div class="flex justify-between items-center p-4 border-b border-gray-100 dark:border-gray-700 flex-1">

      <app-card-component-id [entidad]="empleado()" [label]="EnumEntidad.EMPLEADO" ></app-card-component-id>

      <div class="space-y-2">
        <h3 class="text-md font-bold text-gray-800 dark:text-gray-100 uppercase">
          {{empleado().nombre}}
        </h3>
      </div>

    </div>

    <div class="flex justify-between p-4 border-b border-gray-100 dark:border-gray-700  flex-1">

      <span class="flex flex-col bg-gray-100 dark:bg-gray-700/50 rounded-lg p-2">
        <span class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase leading-none mb-1">Salario Base</span>
        <span class="font-black text-lg sm:text-lg text-slate-600 dark:text-slate-100">
          {{ empleado().salarioBase | currency:'$ ':'symbol':'1.2-2':'en' }}
        </span>
      </span>

      <div class="flex flex-col items-center gap-2">
        <p class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase leading-none">¿Activo?</p>
        <app-badge-si-no [siNo]="empleado().activo"></app-badge-si-no>
      </div>

    </div>

</div>
