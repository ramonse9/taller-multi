
<button type="button" (click)="showModal()" title="Modificar"
        class="text-white dark:text-white bg-lightblue-600 hover:bg-lightblue-500 text-sm rounded-lg  px-2 py-1 text-center inline-flex items-center
        dark:bg-darkblue-600 dark:hover:bg-darkblue-500 cursor-pointer hover:scale-110 transition-transform transition-colors duration-200">
  <ng-icon name="tablerPencil" class="animate-pulse" size="1.5rem"></ng-icon>
  Modificar
</button>

@if(isVisible()){
  <div class="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4">
    <div class="absolute inset-0 bg-gray-900/80 backdrop-blur-sm" (click)="closeModal()"></div>

    <div class="z-50 bg-gray-50 dark:bg-gray-800 rounded-t-2xl sm:rounded-lg w-full max-w-5xl max-h-[90dvh] flex flex-col relative overflow-hidden shadow-xl">

      <div class="p-4 border-b dark:border-gray-700 bg-gray-50 dark:bg-gray-800 shrink-0">
        <div class="flex flex-col md:flex-row md:justify-between gap-4 pr-8"> <div class="flex flex-col">
            <h3 class="text-lg font-semibold dark:text-white flex flex-wrap gap-2 items-center">
              Vehículo | {{ vehiculo().id | uppercase }}
            </h3>
          </div>
        </div>

        <button type="button" (click)="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 z-10 cursor-pointer">
          <ng-icon name="tablerX" size="1.5rem"></ng-icon>
        </button>
      </div>

      <div #scrollContainer class="flex-1 overflow-y-auto p-4 bg-white dark:bg-gray-950">

        @if( vehiculo() ){
          <app-vehiculo-details [vehiculo]="vehiculo()" [mostrarHeader]="false" ></app-vehiculo-details>
        }

      </div>

      <div class="flex justify-between p-4 border-b dark:border-gray-700 bg-gray-50 dark:bg-gray-800 shrink-0">

          <button type="button" (click)="onSubmit()" class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300">
            Guardar
          </button>

          <button type="button" (click)="closeModal()" class="text-gray-400 hover:text-gray-600 z-10 cursor-pointer">
            <ng-icon name="tablerX" size="1.5rem"></ng-icon>
          </button>

      </div>

    </div>
  </div>
}
