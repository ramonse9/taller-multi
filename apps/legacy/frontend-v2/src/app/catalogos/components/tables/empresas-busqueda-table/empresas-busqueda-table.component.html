<div class="w-full border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">
  <div class="hidden md:grid grid-cols-12 bg-gray-100 dark:bg-gray-700 p-3 text-[10px] font-bold uppercase text-gray-500">
    <div class="col-span-1 px-2">ID</div>
    <div class="col-span-4 px-2">Razón Social</div>
    <div class="col-span-3 px-2">RFC</div>
    <div class="col-span-4 px-2">Email</div>
  </div>

  <div class="divide-y divide-gray-200 dark:divide-gray-600">
    @for( empresa of empresas(); track empresa.id ){
      <div (click)="selectEmpresa(empresa)"
           class="p-4 md:p-3 md:grid md:grid-cols-12 items-center bg-white dark:bg-gray-800 hover:bg-blue-50 dark:hover:bg-blue-900/20 cursor-pointer transition-all group">
        
        <div class="flex justify-between md:block md:col-span-1 mb-1 md:mb-0 px-2">
          <span class="md:hidden text-[10px] font-bold text-gray-400 uppercase">ID:</span>
          <span class="text-xs font-mono text-gray-500 dark:text-gray-400">
            {{ empresa.id | uppercase }}
          </span>
        </div>

        <div class="md:col-span-4 mb-2 md:mb-0 px-2">
          <div class="text-sm font-bold text-gray-900 dark:text-white group-hover:text-blue-600 transition-colors">
            {{ empresa.razonSocial | uppercase }}
          </div>
        </div>

        <div class="flex justify-between md:block md:col-span-3 mb-1 md:mb-0 px-2">
          <span class="md:hidden text-xs font-bold text-gray-400 uppercase">RFC:</span>
          <div class="text-sm font-medium text-gray-700 dark:text-gray-300">
            {{ empresa.rfc | uppercase }}
          </div>
        </div>

        <div class="flex justify-between md:block md:col-span-4 px-2">
          <span class="md:hidden text-xs font-bold text-gray-400 uppercase">Email:</span>
          <div class="text-sm text-gray-600 dark:text-gray-400 truncate lowercase">
            {{ empresa.email }}
          </div>
        </div>

      </div>
    }
    @empty {
      <div class="p-8 text-center bg-white dark:bg-gray-800 text-gray-500 text-sm">
        No hay registros disponibles
      </div>
    }
  </div>
</div>
