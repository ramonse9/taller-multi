<div class="p-4 bg-white-2 border-b border-gray-200 dark:bg-gray-900 dark:border-gray-700">
  <div class="flex items-center justify-between w-full">

    <div class="flex-shrink-0">
      <app-page-button-inicio></app-page-button-inicio>
    </div>

    <div class="flex-grow text-center">
      <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">
        CATÁLOGOS | Modelos: {{ modelosRXResource.value()?.totalItems }}
      </h1>
    </div>

  </div>

  <div class="mt-4">
    <app-busqueda-general
      placeholder="Buscar Modelos"
      nuevaEntidad="Nuevo Modelo"
      (idNuevoEmit)="idNuevo()"
      (filtrarBusquedaEmit)="filtrar($event)"
    ></app-busqueda-general>
  </div>
</div>

@if( modelosRXResource.value() ){
    <div class="overflow-x-auto" [@fadeAnimation]>
      <app-modelos-table
        [modelos]="modelosRXResource.value()?.modelos ?? []"
        (idSeleccionarEmit)="idSeleccionar($event)"
        [idSeleccionado]="idSeleccionado()"
      >
      </app-modelos-table>
    </div>
}

<app-pagination [pages]="modelosRXResource.value()?.totalPages ?? 0" [currentPage]="paginationService.currentPage()" (itemsPerPageSelected)="selectPerPageChange($event)" ></app-pagination>


<app-drawer-form-container
  [isOpen]="isOpenDrawer()"
  [idSeleccionado]="idSeleccionado()"

  [resource]="modeloRXResource"

  titleNuevo="Nuevo Modelo"
  titleEditar="Editar Modelo"
  [formTemplateNuevo]="nuevo"
  (closeDrawerEmit)="idDeseleccionar()"
  labelId="Modelo"
>
</app-drawer-form-container>
<ng-template #nuevo let-modelo>
  <app-drawer-modelo-nuevo-editar
    [modelo]="modelo"
    (guardadoCorrectoEmit)="reload()"
  >
  </app-drawer-modelo-nuevo-editar>
</ng-template>
