<form class="" [formGroup]="vehiculoForm" (ngSubmit)="onSubmit()" >

  @if(mostrarHeader()){
    <app-page-form-header [titleNew]="EnumPaginasTitulo.VEHICULO_NEW" [titleUpdate]="EnumPaginasTitulo.VEHICULO_UPDATE" [id]="vehiculo()?.id ?? ''" [detail]="`${vehiculo()?.modelo?.nombre ?? ''}   ${vehiculo()?.anio ?? ''} | Número de Serie: ${vehiculo()?.numeroSerie ?? ''}`" ></app-page-form-header>
  }

  <app-page-form-body 
      [borderColor]="vehiculoForm.valid ? EnumBorderColor.VALID : EnumBorderColor.INVALID">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 w-full">

      <div>
        <app-page-form-control-search-list label="Marca"
        newOption="Seleccione la Marca"
        [options]="marcasRXResource.value()?.marcas ?? []"
        [id]="vehiculoForm.get('id_marca')?.value || 'Nuevo Vehiculo'"
        (optionSelected)="optionSelectedMarca($event)"
        [controlForm]="vehiculoForm.get('id_marca')!"
        >
        </app-page-form-control-search-list>
      </div>

      <div>
        @if( modelosByMarca().length! > 0 ){
          <app-page-form-control-search-list label="Modelo"
          newOption="Seleccione el Modelo"
          [options]="modelosByMarca()"
          [id]="vehiculoForm.get('id_modelo')?.value || ''"
          (optionSelected)="optionSelectedModelo($event)"
          [controlForm]="vehiculoForm.get('id_modelo')!"
          >
          </app-page-form-control-search-list>
        }
        @else{
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Modelo</label>
          <h3 class="dark:text-white text-white bg-lightblue-600 hover:bg-lightblue-500 rounded-lg px-5 py-2.5 text-center inline-flex items-center dark:bg-darkblue-600 dark:hover:bg-darkblue-500">Selecciona una marca para continuar</h3>
        }
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-white">Color</label>
        <input type="text" formControlName="color"  autocomplete="off" class="custom-input-text uppercase"
          [ngClass]="{ 'custom-input-text-error' : vehiculoForm.controls.color.errors }"
        />
        <app-form-error-label [control]="vehiculoForm.controls.color"></app-form-error-label>
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-white">Año</label>
        <input type="text" formControlName="anio"  autocomplete="off" class="custom-input-text"
          [ngClass]="{ 'custom-input-text-error' : vehiculoForm.controls.anio.errors }"
        />
        <app-form-error-label [control]="vehiculoForm.controls.anio"></app-form-error-label>
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-white">
          Número de Serie (últimos 10)
        </label>

        <div class="flex gap-2">
          <input
            type="text"
            formControlName="numeroSerie"
            maxlength="10"
            autocomplete="off"
            class="custom-input-text flex-1 uppercase"
            [ngClass]="{ 'custom-input-text-error' : vehiculoForm.controls.numeroSerie.errors }"
          />
          <app-modal-vehiculos-vin-canva (vinDetectadoEmit)="setNumeroSerie($event)" ></app-modal-vehiculos-vin-canva>
        </div>

        <app-form-error-label [control]="vehiculoForm.controls.numeroSerie"></app-form-error-label>
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-white">Placa</label>
        <input type="text" formControlName="placa"  autocomplete="off" class="custom-input-text uppercase"
          [ngClass]="{ 'custom-input-text-error' : vehiculoForm.controls.placa.errors }"
        />
        <app-form-error-label [control]="vehiculoForm.controls.placa"></app-form-error-label>
      </div>

    </div>
  </app-page-form-body>

</form>

@if(mostrarEspacioInferior()){
  <div class="h-24"></div>
}

<app-voice-button class="block md:hidden" [durationSeconds]="15" [entidadVoice]="EnumEntidadesVoice.VEHICULO" (datosJsonEmit)="voiceDatosVehiculo($event)" ></app-voice-button>
