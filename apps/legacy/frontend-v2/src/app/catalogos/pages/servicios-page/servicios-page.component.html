<div class="p-4 bg-white-2 border-b border-gray-200 dark:bg-gray-900 dark:border-gray-700">
  <div class="flex items-center justify-between w-full">

    <div class="flex-shrink-0">
      <app-page-button-inicio></app-page-button-inicio>
    </div>

    <div class="flex-grow text-center">
      <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">
        CATÁLOGOS | Servicios: {{ serviciosRXResource.value()?.totalItems }}
      </h1>
    </div>

  </div>

  <div class="mt-4">
    <app-busqueda-general
      placeholder="Buscar por Nombre..."
      nuevaEntidad="Nuevo Servicio"
      (idNuevoEmit)="idNuevo()"
      (filtrarBusquedaEmit)="filtrar($event)"
    ></app-busqueda-general>
  </div>
</div>


<app-cards-container
  [listado]="serviciosRXResource.value()?.servicios ?? []"
  [idSeleccionado]="idSeleccionado()"
  [cardTemplate]="card"
  [listMode]="true"
>
    <app-badge-message slot="empty-message" [message]="EnumCeroRegistros.CLIENTES" ></app-badge-message>
</app-cards-container>

<ng-template #card let-servicio let-idSeleccionado="seleccionado">
  <app-card-servicio
    class="h-full"
    [servicio]="servicio"
    [seleccionado]="idSeleccionado"
    (click)="idSeleccionar(servicio.id)"
  >
  </app-card-servicio>
</ng-template>

<app-pagination [pages]="serviciosRXResource.value()?.totalPages ?? 0" [currentPage]="paginationService.currentPage()" (itemsPerPageSelected)="selectPerPageChange($event)"></app-pagination>

<app-drawer-form-container
  [isOpen]="isOpenDrawer()"
  [idSeleccionado]="idSeleccionado()"

  [resource]="servicioRXResource"

  titleNuevo="Nuevo Servicio"
  titleEditar="Editar Servicio"
  [formTemplateNuevo]="nuevo"
  (closeDrawerEmit)="idDeseleccionar()"
  labelId="Servicio"
>
</app-drawer-form-container>
<ng-template #nuevo let-servicio>
  <app-drawer-servicio-nuevo-editar
    [servicio]="servicio"
    (guardadoCorrectoEmit)="reload()"
  >
  </app-drawer-servicio-nuevo-editar>
</ng-template>
