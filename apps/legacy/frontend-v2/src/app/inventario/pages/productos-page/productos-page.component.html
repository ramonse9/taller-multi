<div class="p-4 bg-white-2 border-b border-gray-200 dark:bg-gray-900 dark:border-gray-700">
  <div class="flex items-center justify-between w-full">

    <div class="flex-shrink-0">
      <app-page-button-inicio></app-page-button-inicio>
    </div>

    <div class="flex-grow text-center">
      <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">
        INVENTARIO | Productos: {{ productosRXResource.value()?.totalItems }}
      </h1>
    </div>

  </div>

  <div class="mt-4">
    <app-busqueda-general
      placeholder="Buscar Productos"
      nuevaEntidad="Nuevo Producto"
      (idNuevoEmit)="idNuevo()"
      (filtrarBusquedaEmit)="filtrar($event)"
      [opcionCards]="true"
      (mostrarCardsEmit)="mostrarCards($event)"
    ></app-busqueda-general>
  </div>
</div>

@if( productosRXResource.value() ){

  <div class="relative">

    @if (soloCards()) {
      <div class="relative" [@fadeAnimation]>
        <app-cards-container
          [listado]="productosRXResource.value()?.productos ?? []"
          [idSeleccionado]="idSeleccionado()"
          [cardTemplate]="card"
          [listMode]="true"
        >
          <app-badge-message slot="empty-message" [message]="EnumCeroRegistros.PRODUCTOS" ></app-badge-message>
        </app-cards-container>
      </div>
    } @else {
      <div class="relative overflow-x-auto" [@fadeAnimation]>
        <app-productos-table
          [productos]="productosRXResource.value()?.productos ?? []"
          (idSeleccionarEmit)="idSeleccionar($event)"
          [idSeleccionado]="idSeleccionado()"
        >
        </app-productos-table>
      </div>
    }

    <ng-template #card let-producto let-idSeleccionado="seleccionado">
      <app-card-producto
        class="h-full"
        [producto]="producto"
        [seleccionado]="idSeleccionado"
        (click)="idSeleccionar(producto.id)"
      >
      </app-card-producto>
    </ng-template>

  </div>

}

<app-pagination [pages]="productosRXResource.value()?.totalPages ?? 0" [currentPage]="paginationService.currentPage()" (itemsPerPageSelected)="selectPerPageChange($event)"></app-pagination>

<app-drawer-form-container
  [isOpen]="isOpenDrawer()"
  [idSeleccionado]="idSeleccionado()"

  [resource]="productoRXResource"

  titleNuevo="Nuevo Producto"
  titleEditar="Editar Producto"
  [formTemplateNuevo]="nuevo"
  (closeDrawerEmit)="idDeseleccionar()"
  labelId="Producto"
>
</app-drawer-form-container>
<ng-template #nuevo let-producto>
  <app-drawer-producto-nuevo-editar
    [producto]="producto"
    (guardadoCorrectoEmit)="reload()"
  >
  </app-drawer-producto-nuevo-editar>
</ng-template>
