<div
  class="fixed inset-0 flex items-center justify-center bg-black/50 z-50"
  (click)="closeModal()"
>
  <!-- Contenedor del modal -->
  <div
    class="bg-white dark:bg-slate-800 rounded-lg shadow-lg w-11/12 sm:w-96 p-6"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <h2 class="text-lg font-bold text-slate-700 dark:text-slate-100 mb-4">
      Actualizar Estatus de Compra
    </h2>

    <!-- Estatus actual -->
    <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">
      Estatus actual:
      <app-estatus-badge [categoria]="EnumCategoria.COMPRAS" [clave]="estatus()" ></app-estatus-badge>
    </p>

    <!-- Opciones de acción -->
    <div class="flex items-center">

      @if(estatus() === EnumEstatusCompra.BORRADOR && nuevoEstatus() === EnumEstatusCompra.CONFIRMADA ){
        <!-- Botón Confirmar -->
        <button
          type="button"
          (click)="onSubmit( EnumEstatusCompra.CONFIRMADA)"
          class="flex justify-center items-center gap-2 px-4 py-2 text-sm font-bold text-white bg-green-600 hover:bg-green-700 rounded-lg shadow-md transition-colors w-full"
        >
          <ng-icon name="tablerCheck" size="1rem"></ng-icon>
          Confirmar la Compra
        </button>
      }

      @if(estatus() === EnumEstatusCompra.BORRADOR && nuevoEstatus() === EnumEstatusCompra.CANCELADA ){
        <!-- Botón Confirmar -->
        <button
          type="button"
          (click)="onSubmit( EnumEstatusCompra.CANCELADA)"
          class="flex justify-center items-center gap-2 px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg shadow-md transition-colors w-full"
        >
          <ng-icon name="tablerCheck" size="1rem"></ng-icon>
          Cancelar la Compra
        </button>
      }

      <!--

      @if(estatus() === EnumEstatusCompra.CONFIRMADA && nuevoEstatus() === EnumEstatusCompra.CANCELADA ){
        <button
          type="button"
          (click)="updateStatus('cancelar')"
          class="flex justify-center items-center gap-2 px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg shadow-md transition-colors w-full"
        >
          <ng-icon name="tablerCheck" size="1rem"></ng-icon>
          Cancelar la Compra
        </button>
      }
      -->

      <!-- Botón Cancelar -->
      <!--<button
        type="button"
        (click)="updateStatus('cancelar')"
        class="flex justify-center items-center gap-2 px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg shadow-md transition-colors w-full sm:w-auto"
      >
        <ng-icon name="tablerX" size="1rem"></ng-icon>
        Cancelar
      </button>-->
    </div>

    <!-- Botón cerrar -->
    <div class="mt-4 text-right">
      <button
        type="button"
        (click)="closeModal()"
        class="text-xs text-gray-500 dark:text-gray-400 hover:underline"
      >
        Cerrar
      </button>
    </div>
  </div>
</div>
