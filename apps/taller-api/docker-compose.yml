services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taller_v2
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_user -d taller_v2']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
